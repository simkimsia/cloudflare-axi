name: Repo triage

# Standing triage crewmate. Fetches the eligible issue/PR queue, renders a
# per-rule VISION.md verdict, and in dry-run mode writes the verdicts to the
# run summary only. Dispatch with mode=live to post the comment and the
# ready-for-pr label. The cron stays dry-run. Never merges, closes, or opens PRs.

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      owner:
        description: "GitHub login the fetch skips (pilot: pass a dummy so the owner's own issues get triaged)"
        required: false
        default: "simkimsia"
      mode:
        description: "dry-run (log only) or live (post comment + ready-for-pr label)"
        required: false
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - live

concurrency:
  group: repo-triage
  cancel-in-progress: false

# Provenance stamped into every verdict: <!-- triage: ... model= harness= run= -->
# TRIAGE_MODEL is the single source of truth for --model below. Change it here only.
env:
  TRIAGE_MODEL: claude-opus-5
  TRIAGE_HARNESS: claude-github-app

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/repo-triage owner=${{ inputs.owner || 'simkimsia' }} mode=${{ inputs.mode || 'dry-run' }} model=${{ env.TRIAGE_MODEL }} harness=${{ env.TRIAGE_HARNESS }} run=${{ github.run_id }}"
          claude_args: |
            --model ${{ env.TRIAGE_MODEL }}
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Write,Bash(python3 .claude/skills/repo-triage/scripts/fetch.py:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue comment:*),Bash(gh issue edit:*)"

      - name: Publish verdicts to the run summary
        if: always()
        run: |
          if [ -f triage-out/verdicts.md ]; then
            cat triage-out/verdicts.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No triage-out/verdicts.md was written." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep verdicts as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: triage-verdicts
          path: triage-out/
          if-no-files-found: ignore
